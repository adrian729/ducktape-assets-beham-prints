# descriptive: find it and understand it
id: candelabrum-with-two-blindfolded-women
title: Candelabrum carried by two blindfolded women
description: A tall, narrow, symmetrical engraved candelabrum. At the top a winged putto stands on a leafy cushion with both arms raised, gripping the curled tips of two acanthus volutes. Below him a lobed cup, a gadrooned bowl and a baluster stem with a second small bowl, each stage flanked by mirrored acanthus scrolls and leaf sprays. At the base two nude blindfolded women kneel back to back with spiral volutes in place of arms and carry the shaft on their heads. Black ink line work on cream paper, background transparent.
