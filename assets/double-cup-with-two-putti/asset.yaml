id: double-cup-with-two-putti
title: Double cup with two putti
description: A tall, symmetrical engraved double cup. A round foot and knopped stem carry a bulbous lower bowl, a wide band decorated with masks, lozenges and strapwork, and an inverted upper bowl topped by a small cup; thin leafy tendrils with two small birds rise from the sides and tasselled pendants hang at the left and right. At the base two winged putti sit on either side of the stem, each resting a hand on a blank strapwork cartouche. Black ink line work on cream paper, background transparent.
