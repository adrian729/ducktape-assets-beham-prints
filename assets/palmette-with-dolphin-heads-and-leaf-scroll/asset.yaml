# descriptive: find it and understand it
id: palmette-with-dolphin-heads-and-leaf-scroll
title: Palmette between two dolphin heads
description: A horizontal, symmetrical engraved panel. A large palmette fan rises from a small pedestal with two volutes at the bottom centre; below it two scaly dolphin heads with open toothed jaws face each other. To each side thin stems curl into acanthus volutes with lobed leaves, a trumpet-shaped horn, a round berry, a bud and a small flower head, ending in upright leaf clusters at the outer edges. Black ink line work on cream paper, background transparent.
