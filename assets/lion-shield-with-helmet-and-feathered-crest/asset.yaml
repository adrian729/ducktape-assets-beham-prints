id: lion-shield-with-helmet-and-feathered-crest
title: Coat of arms with rampant lion and feather crest
description: An engraved coat of arms. A tilted shield bears a rampant lion with a curled tail, facing left. Above it a closed tilting helmet turned to the right carries a tall crest of two fans of feathers rising from a twisted wreath. Plain cloth mantling with scalloped edges hangs in long folds on both sides of the helmet and tucks behind the shield. Black ink line work on cream paper, background transparent.
