# descriptive: find it and understand it
id: centaurs-and-riders-foliate-frieze
title: Frieze of four centaurs with riders
description: A horizontal engraved frieze of four centaurs, two on each side, rearing toward the centre. The two inner centaurs, bearded and leaf-crowned, each carry a young rider and together grip a leafy spray that rises from a small bowl at the bottom centre; the two outer centaurs carry nude women who hold long feathery fronds arching over the ends. Trefoil sprigs and a low band of acanthus scrolls run between the hooves. Black ink line work on cream paper, no rules, background transparent.
