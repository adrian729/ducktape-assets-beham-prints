id: horned-helmet-with-leafy-mantling-and-shield
title: Coat of arms with horned helmet
description: An engraved coat of arms. A tilted shield bears a diagonal band charged with three small shields. Above it a closed tilting helmet turned to the right carries a crest of two tall curved horns with trumpet-shaped ends. Leafy mantling hangs from knotted ties on each side of the helmet and curls down around the shield in scalloped acanthus fronds. Black ink line work on cream paper, background transparent.
