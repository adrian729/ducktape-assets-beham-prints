id: rooster-shield-and-helmet-with-leafy-mantling
title: Coat of arms with rooster and banderoles
description: An engraved coat of arms. A rounded shield bears a strutting rooster facing left on a stippled ground. Above it a closed tilting helmet turned to the left carries a coronet on which a crowned rooster stands between two curved horns, also facing left. Leafy acanthus mantling curls down both sides of the shield, and long blank banderoles loop above and beside the helmet. Black ink line work on cream paper, background transparent.
