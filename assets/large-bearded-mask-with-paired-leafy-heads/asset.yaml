# descriptive: find it and understand it
id: large-bearded-mask-with-paired-leafy-heads
title: Bearded mask in a leaf scroll
description: A horizontal, symmetrical engraved panel centred on a large frontal mask of a bearded man with an open mouth, small curled horns at the temples and a ribbed cap bound with a leaf garland; his beard flows down into leaf fronds. From the cap two long swags of overlapping leaves fall to either side, and thin stems with acanthus volutes, lobed leaves and small buds fill both halves. Halfway down each side a leafy beaked head bites a stem. Black ink line work on cream paper, background transparent.
